<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Validadora de Histórias de Usuário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Custom styles for rendered markdown */
    .prose ul, .prose-sm ul {
      list-style-type: disc;
      list-style-position: inside;
      padding-left: 1rem;
    }
    .prose li, .prose-sm li {
      margin-bottom: 0.25rem;
    }
    .prose p:last-child, .prose-sm p:last-child {
      margin-bottom: 0;
    }
    .prose strong, .prose-sm strong {
      color: #e5e7eb; /* gray-200 */
    }

    /* Indeterminate progress bar animation */
    @keyframes indeterminate-progress {
      0% { left: -50%; width: 50%; }
      100% { left: 100%; width: 50%; }
    }
    .animate-indeterminate-progress {
      animation: indeterminate-progress 2s linear infinite;
    }
  </style>

</head>
<body class="bg-gray-900 text-gray-100">
  <app-root></app-root>
</body>
</html>
