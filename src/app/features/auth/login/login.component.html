<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">PO Agent</h1>
      <p class="text-gray-400">Valide e refine suas histórias com IA</p>
    </div>

    <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800 shadow-xl">
      <h2 class="text-xl font-semibold text-white mb-6">Entrar</h2>

      @if (error()) {
        <div class="mb-4 p-3 rounded-lg bg-red-950 border border-red-800 text-red-300 text-sm">
          {{ error() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">E-mail</label>
          <input
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required
            class="w-full px-4 py-2.5 rounded-lg bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
            placeholder="seu@email.com"
          />
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-1">Senha</label>
          <input
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required
            class="w-full px-4 py-2.5 rounded-lg bg-gray-800 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold transition"
        >
          {{ isLoading() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-500">
        Não tem conta?
        <a routerLink="/register" class="text-blue-400 hover:text-blue-300 transition">Cadastre-se</a>
      </p>
    </div>
  </div>
</div>
