name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (production)
        run: |
          sed -i "s|__RAILWAY_API_URL__|https://placeholder.railway.app|g" src/environments/environment.prod.ts
          npm run build -- --configuration=production
